<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Meta</h1>
  <div id="stats"></div>
  <h2>Commits by time of day</h2>
  <label style="display:flex; align-items:baseline; gap:0.5em; margin-bottom:1em;">Show commits until:
    <input type="range" min="0" max="100" value="100" id="commit-progress" style="flex:1; margin: 0 0.5em;" />
    <time id="commit-time"></time>
  </label>
  <div id="scrolly-1">
    <div id="scatter-story"></div>
    <div id="scatter-plot">
      <div id="chart"></div>
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </div>
  </div>
  <dl id="files"></dl>
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt><dd><a href="" id="commit-link" target="_blank"></a></dd>
    <dt>Date</dt><dd id="commit-date"></dd>
    <dt>Time</dt><dd id="commit-time-tooltip"></dd>
    <dt>Author</dt><dd id="commit-author"></dd>
    <dt>Lines</dt><dd id="commit-lines"></dd>
  </dl>
  <script type="module" src="main.js"></script>
</body>
</html>
